        return html`<g key=${s.id} class=${`pl-slot ${clickable ? 'clickable' : ''} ${movable ? 'draggable' : ''} ${sel ? 'selected' : ''} ${bad ? 'invalid' : ''}`}
          role=${interactive ? 'button' : null} tabIndex=${interactive ? 0 : null}
          aria-label=${interactive ? tip : null} aria-pressed=${interactive ? String(sel) : null}
          onClick=${movable ? null : act} onPointerDown=${movable ? (e) => startSlotDrag(s, e) : null}
          onKeyDown=${interactive ? keys : null}>
          <rect class="zone" x=${s.x} y=${s.y} width=${s.w} height=${s.d} rx="2" />
          ${!prod && fit && html`<text x=${cx} y=${cy + fs * 0.22} font-size=${fs * 0.66} text-anchor="middle" transform=${fit.vertical ? `rotate(-90 ${cx} ${cy})` : null}>${fit.text}</text>`}
        </g>`;
      })}
      ${shownProducts.map((pr) => {
        const tr = backTransform(pr.rect, pr.back);
        return html`<g key=${`p-${pr.slot_id}`} class="pl-item product" pointer-events="none">
          <g transform=${tr.t}>${bodyShape(pr.category, tr.lw, tr.ld, COLOUR_HEX[pr.colour] || '#ddd')}${symbolParts(pr.category, tr.lw, tr.ld)}</g>
          ${!compact && html`<${PieceLabel} r=${pr.rect} name=${pr.title} fs=${fs * 0.92} />`}
        </g>`;
      })}
      ${shown.map((p) => {
        const back = backOf(p, er, shown);
        const tr = backTransform(p, back);
        const sel = p.ref_id === selectedId;
        const invalid = itemDrag && itemDrag.id === p.ref_id && dragError;
        const cls = `pl-item ${editable ? 'editable' : ''} ${sel ? 'selected' : ''} ${invalid ? 'invalid' : ''}`;
        return html`<g key=${p.ref_id} class=${cls}
          tabIndex=${editable ? 0 : null} role=${editable ? 'button' : null}
          aria-label=${editable ? `${p.name}, ${p.w} by ${p.d} centimetres${p.locked ? ', locked' : ''}. Arrow keys move it, R rotates, L locks.` : null}
          aria-pressed=${editable ? String(sel) : null}
          onPointerDown=${editable ? (e) => startDrag(p, e) : null}
          onKeyDown=${editable && onKey ? (e) => onKey(p.ref_id, e) : null}
          onFocus=${editable && onSelect ? () => onSelect(p.ref_id) : null}>
          <g transform=${tr.t}>${bodyShape(p.category, tr.lw, tr.ld)}${symbolParts(p.category, tr.lw, tr.ld)}</g>
          ${!compact && html`<${PieceLabel} r=${p} name=${p.name} sub=${`${p.w} × ${p.d}`} fs=${fs} />`}
          ${p.locked && html`<g transform=${`translate(${p.x + p.w - fs * 0.95} ${p.y + fs * 0.25})`}>
            <rect class="pl-lock" x=${fs * 0.1} y=${fs * 0.36} width=${fs * 0.6} height=${fs * 0.44} rx=${fs * 0.08} />
            <path d=${`M${fs * 0.2},${fs * 0.38}V${fs * 0.24}A${fs * 0.2},${fs * 0.2} 0 0 1 ${fs * 0.6},${fs * 0.24}V${fs * 0.38}`} fill="none" stroke="currentColor" class="pl-door" />
          </g>`}
        </g>`;
      })}
    </svg>
    ${(editable || editableSlots) && html`<p class=${`small ${dragError ? 'err' : 'faint'}`} aria-live="polite" style="min-height:1.5em;margin-top:6px">${drag && (drag.x !== drag.ox || drag.y !== drag.oy) ? dragError || 'Release to place it here.' : ''}</p>`}
  </div>`;
}

function SymbolIcon({ category, w, d, colour, size }) {
  const lw = w || 60, ld = d || 60;
  const pad = Math.max(lw, ld) * 0.08;
  return html`<svg class="sym" viewBox=${`${-pad} ${-pad} ${lw + 2 * pad} ${ld + 2 * pad}`} width=${size || 40} height=${size || 40} aria-hidden="true">
    <g class=${`pl-item ${colour ? 'product' : ''}`}>${bodyShape(category, lw, ld, colour ? COLOUR_HEX[colour] : null)}${symbolParts(category, lw, ld)}</g>
  </svg>`;
}

// A product's footprint drawn inside the gap it would fill, both to scale.
function FitPic({ product, slot, size }) {
  const f = slot && Engine.fitInSlot(product, slot);
  if (!slot || !f) return html`<${SymbolIcon} category=${product.category} w=${product.width_cm} d=${product.depth_cm} colour=${product.colour} size=${size || 80} />`;
  const alongIsX = slot.wall ? slot.wall === 'N' || slot.wall === 'S' : slot.w >= slot.d;
  const sw = alongIsX ? slot.w : slot.d, sd = alongIsX ? slot.d : slot.w;
  const pw = f.rotation === (alongIsX ? 0 : 90) ? product.width_cm : product.depth_cm;
  const pd = f.rotation === (alongIsX ? 0 : 90) ? product.depth_cm : product.width_cm;
  const pad = Math.max(sw, sd) * 0.1;
  return html`<svg viewBox=${`${-pad} ${-pad} ${sw + 2 * pad} ${sd + 2 * pad}`} width=${size || 80} height=${size || 80} aria-hidden="true">
    <rect x="0" y="0" width=${sw} height=${sd} rx="1.5" fill="none" stroke="var(--accent)" stroke-width="1.2" stroke-dasharray="4 3" vector-effect="non-scaling-stroke" />
    <g class="pl-item product"><g transform=${`translate(${(sw - pw) / 2} 0)`}>${bodyShape(product.category, pw, pd, COLOUR_HEX[product.colour])}${symbolParts(product.category, pw, pd)}</g></g>
    <line x1=${-pad * 0.6} y1="0" x2=${sw + pad * 0.6} y2="0" stroke="var(--wall)" stroke-width="3" vector-effect="non-scaling-stroke" />
  </svg>`;
}

/* room3d.js */
/* 3D room view: a dollhouse cutaway with top and side views, built with three.js (loaded on demand).
   Units are centimetres. Room x maps to three.js X, room y (north to south) maps to Z, height is Y. */
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js';
const ORBIT_URL = 'https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js';

function loadThree() {
  if (window.THREE && window.THREE.OrbitControls) return Promise.resolve(window.THREE);
  if (loadThree.p) return loadThree.p;
  const add = (src) => new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error(`Couldn't load ${src}`));
    document.head.appendChild(s);
  });
  loadThree.p = (window.THREE ? Promise.resolve() : add(THREE_URL)).then(() => add(ORBIT_URL)).then(() => window.THREE);
  loadThree.p.catch(() => { loadThree.p = null; });
  return loadThree.p;
}

const WALL_H = 250, WALL_T = 10, DOOR_H = 210, SILL = 90, WIN_TOP = 210;
const DEFAULT_H = { bed: 45, desk: 75, wardrobe: 200, chair: 85, 'bedside-table': 55, bookcase: 180, dresser: 80, 'floor-lamp': 150, sofa: 85, armchair: 85, 'coffee-table': 42, 'tv-unit': 50 };
const OWNED_COLOUR = { bed: '#cfb18b', wardrobe: '#ece6da', desk: '#cfb18b', chair: '#8b7d6e', 'bedside-table': '#cfb18b', bookcase: '#e4ddcf', dresser: '#d9c4a4', 'floor-lamp': '#bdb6aa', sofa: '#9ba59e', armchair: '#a79b8d', 'coffee-table': '#cfb18b', 'tv-unit': '#e4ddcf' };
// Where the door's quarter-circle swing starts, per wall, for a CircleGeometry laid flat on the floor.
const SWING_START = { N: -Math.PI / 2, S: 0, W: -Math.PI / 2, E: Math.PI };
const BACK_ROT = { N: 0, S: Math.PI, W: Math.PI / 2, E: -Math.PI / 2 };

function woodTexture(THREE) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const g = c.getContext('2d');
  let seed = 7;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  const rows = 8;
  for (let r = 0; r < rows; r++) {
    let x = -rnd() * 300;
    while (x < 512) {
      const len = 220 + rnd() * 260;
      const l = 62 + rnd() * 10;
      g.fillStyle = `hsl(${30 + rnd() * 6}, ${34 + rnd() * 8}%, ${l}%)`;
      g.fillRect(x, r * 64, len, 64);
      g.strokeStyle = 'rgba(70,45,20,0.10)';
      for (let k = 0; k < 6; k++) {
        const y = r * 64 + 8 + rnd() * 48;
        g.beginPath(); g.moveTo(x, y); g.bezierCurveTo(x + len * 0.3, y + 3, x + len * 0.6, y - 3, x + len, y); g.stroke();
      }
      g.fillStyle = 'rgba(60,40,20,0.35)';
      g.fillRect(x, r * 64, 2, 64);
      x += len;
    }
    g.fillStyle = 'rgba(60,40,20,0.30)';
    g.fillRect(0, r * 64, 512, 1.5);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.encoding = THREE.sRGBEncoding;
  return t;
}

// One piece of furniture in local coordinates: width along x, depth along z, back edge at z = -ld/2.
function buildPiece(THREE, cat, lw, ld, h, colour, mats) {
  const g = new THREE.Group();
  const main = mats.get(colour, 0.75);
  const dark = mats.get('#2c2e30', 0.5);
  const linen = mats.get('#f2eee6', 0.95);
  const line = mats.get(shade(colour, -0.28), 0.8);
  const metal = mats.get('#b9b4aa', 0.35, 0.6);
  const B = (w, hh, d, x, y0, z, m) => {
    if (w <= 0 || hh <= 0 || d <= 0) return;
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, hh, d), m || main);
    mesh.position.set(x, y0 + hh / 2, z);
    mesh.castShadow = true; mesh.receiveShadow = true;
    g.add(mesh);
  };
  const C = (rt, rb, hh, x, y0, z, m, seg) => {
    const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, hh, seg || 20), m || main);
    mesh.position.set(x, y0 + hh / 2, z);
    mesh.castShadow = true; mesh.receiveShadow = true;
    g.add(mesh);
  };
  const legs = (top, inset, w = 4) => {
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) B(w, top, w, sx * (lw / 2 - inset), 0, sz * (ld / 2 - inset), main);
  };
  const backZ = -ld / 2;
  if (cat === 'bed') {
    B(lw, 26, ld, 0, 0, 0);
    B(lw - 6, 20, ld - 14, 0, 26, 4, linen);
    B(lw, Math.max(30, Math.min(h, 120)), 6, 0, 0, backZ + 3);
    const pw = lw > 115 ? (lw - 30) / 2 : lw - 20;
    if (lw > 115) { B(pw, 10, 30, -(pw / 2 + 5), 46, backZ + 26, linen); B(pw, 10, 30, pw / 2 + 5, 46, backZ + 26, linen); }
    else B(pw, 10, 30, 0, 46, backZ + 26, linen);
    const bl = ld * 0.56;
    B(lw - 2, 4, bl, 0, 46, ld / 2 - bl / 2 - 5, mats.get('#a9b8a8', 0.95));
  } else if (cat === 'sofa' || cat === 'armchair') {
    const seatH = 40, arm = Math.min(16, lw * 0.13);
    B(lw, seatH, ld, 0, 0, 0);
    B(lw, Math.max(20, h - seatH), 18, 0, seatH, backZ + 9);
    B(arm, 22, ld, -(lw / 2 - arm / 2), seatH, 0);
    B(arm, 22, ld, lw / 2 - arm / 2, seatH, 0);
    const n = cat === 'armchair' ? 1 : lw > 185 ? 3 : 2;
    const cw = (lw - 2 * arm) / n;
    for (let i = 0; i < n; i++) B(cw - 2, 10, ld - 22, -lw / 2 + arm + cw * i + cw / 2, seatH, 9, mats.get(shade(colour, 0.06), 0.95));
  } else if (cat === 'chair') {
    legs(44, 4, 3);
    B(lw, 5, ld, 0, 44, 0);
    B(lw, Math.max(20, h - 49), 4, 0, 49, backZ + 2);
  } else if (cat === 'desk') {
    B(lw, 4, ld, 0, h - 4, 0);
    legs(h - 4, 4);
    B(32, 1.5, 22, lw * 0.12, h, 4, dark);
    const scr = new THREE.Mesh(new THREE.BoxGeometry(32, 21, 1.2), dark);
    scr.position.set(lw * 0.12, h + 11, -6);
    scr.rotation.x = -0.18;
    scr.castShadow = true;
    g.add(scr);
  } else if (cat === 'wardrobe') {
    B(lw, h, ld, 0, 0, 0);
    if (lw > 70) B(0.8, h - 12, 0.6, 0, 6, ld / 2 + 0.3, line);
    B(1.6, 20, 1.6, lw > 70 ? -4 : lw / 2 - 8, h * 0.42, ld / 2 + 1, metal);
    if (lw > 70) B(1.6, 20, 1.6, 4, h * 0.42, ld / 2 + 1, metal);
  } else if (cat === 'bookcase') {
    B(2, h, ld, -(lw / 2 - 1), 0, 0); B(2, h, ld, lw / 2 - 1, 0, 0);
    B(lw, 2, ld, 0, h - 2, 0); B(lw, 5, ld, 0, 0, 0); B(lw, h, 1, 0, 0, backZ + 0.5);
    const shelves = Math.max(2, Math.floor(h / 36));
    const gap = (h - 5) / shelves;
    const bookCols = ['#b65a3c', '#3f5f7a', '#d9b45a', '#5c7d5a', '#7a4b6b', '#e7e1d4'];
    let k = 0;
    for (let s = 0; s < shelves; s++) {
      const y = 5 + gap * s;
      if (s > 0) B(lw - 4, 2, ld - 2, 0, y, 1);
      let x = -lw / 2 + 4;
      while (x < lw / 2 - 12) {
        const bw = 2.5 + ((k * 7) % 4);
        const bh = Math.min(gap - 6, 18 + ((k * 5) % 9));
        B(bw, bh, ld - 8, x + bw / 2, y + 2, 2, mats.get(bookCols[k % bookCols.length], 0.9));
        x += bw + 0.6; k++;
        if (k % 9 === 0) x += 10;
      }
    }
  } else if (cat === 'dresser') {
    B(lw, h, ld, 0, 0, 0);
    for (let i = 1; i <= 3; i++) {
      const y = (h / 4) * i;
      B(lw - 6, 0.8, 0.6, 0, y, ld / 2 + 0.3, line);
      B(8, 1.2, 1.2, 0, y - h / 8, ld / 2 + 0.8, metal);
    }
    B(8, 1.2, 1.2, 0, h - h / 8, ld / 2 + 0.8, metal);
  } else if (cat === 'bedside-table') {
    B(lw, h, ld, 0, 0, 0);
    B(lw - 6, 0.8, 0.6, 0, h * 0.62, ld / 2 + 0.3, line);
    C(6, 6, 2, 0, h, 0, metal);
    C(0.8, 0.8, 16, 0, h + 2, 0, metal, 8);
    const shadeMat = mats.get('#f6ecd6', 0.9);
    shadeMat.emissive = new THREE.Color('#f3d9a6'); shadeMat.emissiveIntensity = 0.35;
    C(6, 9, 13, 0, h + 16, 0, shadeMat);
  } else if (cat === 'floor-lamp') {
    const m = Math.min(lw, ld);
    C(m * 0.32, m * 0.34, 3, 0, 0, 0, dark);
    C(1.2, 1.2, Math.max(40, h - 30), 0, 3, 0, metal, 8);
    const shadeMat = mats.get(colour === '#4a4a4a' ? '#f1e6cf' : shade(colour, 0.25), 0.9);
    shadeMat.emissive = new THREE.Color('#f5dcaa'); shadeMat.emissiveIntensity = 0.45;
    C(m * 0.26, m * 0.42, 28, 0, Math.max(43, h - 27), 0, shadeMat);
  } else if (cat === 'coffee-table') {
    B(lw, 4, ld, 0, h - 4, 0);
    legs(h - 4, 5);
    B(18, 3, 12, -lw * 0.15, h, 0, mats.get('#5c7d5a', 0.9));
  } else if (cat === 'tv-unit') {
    B(lw, h, ld, 0, 0, 0);
    B(lw - 6, 0.8, 0.6, 0, h * 0.5, ld / 2 + 0.3, line);
    const tw = Math.min(lw * 0.78, 140);
    B(14, 2, 10, 0, h, backZ + 10, dark);
    B(tw, tw * 0.56, 3, 0, h + 4, backZ + 10, dark);
  } else {
    B(lw, h, ld, 0, 0, 0);
  }
  return g;
}

function shade(hex, amt) {
  const n = parseInt(String(hex).replace('#', ''), 16);
  if (Number.isNaN(n)) return hex;
  let r = (n >> 16) & 255, gg = (n >> 8) & 255, b = n & 255;
  const f = (v) => Math.max(0, Math.min(255, Math.round(amt >= 0 ? v + (255 - v) * amt : v * (1 + amt))));
  r = f(r); gg = f(gg); b = f(b);
  return `#${((1 << 24) + (r << 16) + (gg << 8) + b).toString(16).slice(1)}`;
}

function createScene(THREE, host, handlers) {
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  host.appendChild(renderer.domElement);
  renderer.domElement.style.display = 'block';
  renderer.domElement.style.width = '100%';
  renderer.domElement.style.height = '100%';

  const scene = new THREE.Scene();
  const hemi = new THREE.HemisphereLight(0xffffff, 0xb8afa2, 0.85);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff6ea, 0.95);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.bias = -0.0004;
  scene.add(sun);
  scene.add(sun.target);

  const content = new THREE.Group();
  scene.add(content);
  const matCache = new Map();
  const mats = {
    get(colour, rough, metalness) {
      const key = `${colour}|${rough}|${metalness || 0}`;
      if (!matCache.has(key)) matCache.set(key, new THREE.MeshStandardMaterial({ color: new THREE.Color(colour), roughness: rough == null ? 0.8 : rough, metalness: metalness || 0 }));
      return matCache.get(key);
    },
  };
  const floorTex = woodTexture(THREE);
  let transient = []; // materials made per build (not cached), disposed on the next build
  const temp = (m) => { transient.push(m); return m; };
  let walls = [];
  let pickables = [];
  let state = { W: 300, L: 350 };
  let camera = null, controls = null, mode = 'dollhouse', sideWall = 'N';

  function size() {
    const w = host.clientWidth || 600, h = host.clientHeight || 450;
    return { w, h };
  }

  function render() {
    if (!camera) return;
    if (mode === 'dollhouse' || mode === 'side') updateCutaway();
    renderer.render(scene, camera);
  }

  function updateCutaway() {
    const cx = state.W / 2, cz = state.L / 2;
    const v = new THREE.Vector3(camera.position.x - cx, 0, camera.position.z - cz);
    const len = v.length();
    if (len > 0) v.divideScalar(len);
    for (const w of walls) {
      const d = w.normal.x * v.x + w.normal.z * v.z;
      const hide = mode === 'side' ? w.side === OPPOSITE[sideWall] : d > 0.28;
      w.group.visible = !hide;
    }
  }

  function disposeTree(obj) {
    obj.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
  }

  function buildWalls(room) {
    const W = room.width_cm, L = room.length_cm;
    const wallMat = mats.get('#f5f3ee', 0.95);
    const topMat = mats.get('#dcd8cf', 0.9);
    const glass = temp(new THREE.MeshStandardMaterial({ color: 0xbfd6e8, transparent: true, opacity: 0.32, roughness: 0.1, metalness: 0.1 }));
    const frameMat = mats.get('#ffffff', 0.6);
    const doorMat = mats.get('#f7f6f2', 0.7);
    const defs = {
      N: { len: W, normal: new THREE.Vector3(0, 0, -1) },
      S: { len: W, normal: new THREE.Vector3(0, 0, 1) },
      W: { len: L, normal: new THREE.Vector3(-1, 0, 0) },
      E: { len: L, normal: new THREE.Vector3(1, 0, 0) },
    };
    const place = (side, s0, s1, y0, y1, mat, thick, inset) => {
      const t = thick || WALL_T, off = inset == null ? -t / 2 : inset;
      const len = s1 - s0, h = y1 - y0;
      if (len <= 0 || h <= 0) return null;
      const horiz = side === 'N' || side === 'S';
      const geo = horiz ? new THREE.BoxGeometry(len, h, t) : new THREE.BoxGeometry(t, h, len);
      const m = new THREE.Mesh(geo, mat);
      const sm = (s0 + s1) / 2, ym = (y0 + y1) / 2;
      if (side === 'N') m.position.set(sm, ym, off);
      if (side === 'S') m.position.set(sm, ym, L - off);
      if (side === 'W') m.position.set(off, ym, sm);
      if (side === 'E') m.position.set(W - off, ym, sm);
      m.castShadow = true; m.receiveShadow = true;
      return m;
    };
    walls = [];
    for (const side of ['N', 'E', 'S', 'W']) {
      const grp = new THREE.Group();
      const def = defs[side];
      const horiz = side === 'N' || side === 'S';
      const start = horiz ? -WALL_T : 0, end = horiz ? def.len + WALL_T : def.len;
      const openings = [];
      if (room.door.wall === side) openings.push({ s0: room.door.offset_cm, s1: room.door.offset_cm + room.door.width_cm, y0: 0, y1: DOOR_H, door: true });
      for (const win of room.windows || []) if (win.wall === side) openings.push({ s0: win.offset_cm, s1: win.offset_cm + win.width_cm, y0: SILL, y1: WIN_TOP });
      openings.sort((a, b) => a.s0 - b.s0);
      let cur = start;
      for (const o of openings) {
        const seg = place(side, cur, o.s0, 0, WALL_H, wallMat); if (seg) grp.add(seg);
        const below = place(side, o.s0, o.s1, 0, o.y0, wallMat); if (below) grp.add(below);
        const above = place(side, o.s0, o.s1, o.y1, WALL_H, wallMat); if (above) grp.add(above);
        if (o.door) {
          const leaf = place(side, o.s0 + 2, o.s1 - 2, 0, o.y1 - 2, doorMat, 4); if (leaf) grp.add(leaf);
          for (const [a, b] of [[o.s0 - 6, o.s0], [o.s1, o.s1 + 6]]) { const jamb = place(side, a, b, 0, o.y1 + 6, frameMat, 13, -WALL_T / 2 + 1.5); if (jamb) grp.add(jamb); }
          const head = place(side, o.s0 - 6, o.s1 + 6, o.y1, o.y1 + 6, frameMat, 13, -WALL_T / 2 + 1.5); if (head) grp.add(head);
          const knob = place(side, o.s1 - 12, o.s1 - 6, 98, 104, mats.get('#b9b4aa', 0.35, 0.6), 6, 1); if (knob) grp.add(knob);
        } else {
          const pane = place(side, o.s0, o.s1, o.y0, o.y1, glass, 1.5); if (pane) { pane.castShadow = false; grp.add(pane); }
          const mid = (o.s0 + o.s1) / 2;
          const mul = place(side, mid - 2, mid + 2, o.y0, o.y1, frameMat, 4); if (mul) grp.add(mul);
          const sill = place(side, o.s0 - 4, o.s1 + 4, o.y0 - 3, o.y0, frameMat, 16, -2); if (sill) grp.add(sill);
        }
        cur = o.s1;
      }
      const last = place(side, cur, end, 0, WALL_H, wallMat); if (last) grp.add(last);
      const cap = place(side, start, end, WALL_H, WALL_H + 1, topMat); if (cap) grp.add(cap);
      walls.push({ side, normal: def.normal, group: grp });
      content.add(grp);
    }
    // the door's swing, drawn faintly on the floor like the plan's arc, so the clear zone reads in 3D too
    const { wall, offset_cm: o, width_cm: dw } = room.door;
    const swing = new THREE.Mesh(new THREE.CircleGeometry(dw, 28, SWING_START[wall], Math.PI / 2),
      temp(new THREE.MeshBasicMaterial({ color: 0x8a948f, transparent: true, opacity: 0.16, depthWrite: false })));
    swing.rotation.x = -Math.PI / 2;
    const hinge = { N: [o, 0], S: [o, L], W: [0, o], E: [W, o] }[wall];
    swing.position.set(hinge[0], 0.4, hinge[1]);
    content.add(swing);
  }

  function build(p) {
    const { room } = p;
    disposeTree(content);
    content.clear();
    transient.forEach((m) => m.dispose());
    transient = [];
    pickables = [];
    state = { W: room.width_cm, L: room.length_cm };
    const W = room.width_cm, L = room.length_cm;
    floorTex.repeat.set(W / 160, L / 160);
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, L), temp(new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.75 })));
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(W / 2, 0, L / 2);
    floor.receiveShadow = true;
    content.add(floor);
    buildWalls(room);
    const accent = new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#6a49b3');
    const filledSlots = new Set((p.products || []).map((x) => x.slot_id));
    for (const s of p.slots || []) {
      if (filledSlots.has(s.id)) continue;
      const sel = s.id === p.selectedSlotId;
      const pl = new THREE.Mesh(new THREE.PlaneGeometry(s.w, s.d), temp(new THREE.MeshBasicMaterial({ color: accent, transparent: true, opacity: sel ? 0.45 : 0.22, depthWrite: false })));
      pl.rotation.x = -Math.PI / 2;
      pl.position.set(s.x + s.w / 2, 0.6, s.y + s.d / 2);
      pl.userData = { slot_id: s.id };
      content.add(pl);
      pickables.push(pl);
      const edges = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(s.w, 1, s.d)), temp(new THREE.LineBasicMaterial({ color: accent })));
      edges.position.set(s.x + s.w / 2, 0.8, s.y + s.d / 2);
      content.add(edges);
    }
    const addPiece = (r, back, cat, h, colour, id, kind) => {
      const horizBack = back === 'N' || back === 'S';
      const lw = horizBack ? r.w : r.d, ld = horizBack ? r.d : r.w;
      const piece = buildPiece(THREE, cat, lw, ld, h, colour, mats);
      piece.position.set(r.x + r.w / 2, 0, r.y + r.d / 2);
      piece.rotation.y = BACK_ROT[back] || 0;
      piece.traverse((o) => { o.userData = { [kind]: id }; });
      content.add(piece);
      pickables.push(piece);
      if ((kind === 'ref_id' && id === p.selectedId) || (kind === 'slot_id' && id === p.selectedSlotId)) {
        const helper = new THREE.BoxHelper(piece, accent);
        temp(helper.material);
        content.add(helper);
      }
    };
    const er = { width_cm: W, length_cm: L, door: room.door, windows: room.windows || [] };
    for (const it of p.placements || []) addPiece(it, backOf(it, er, p.placements), it.category, DEFAULT_H[it.category] || 60, OWNED_COLOUR[it.category] || '#cfb18b', it.ref_id, 'ref_id');
    for (const pr of p.products || []) addPiece(pr.rect, pr.back, pr.category, pr.height || DEFAULT_H[pr.category] || 60, COLOUR_HEX[pr.colour] || '#cccccc', pr.slot_id, 'slot_id');
    const span = Math.max(W, L);
    sun.position.set(W * 0.85, span * 1.6, L * 1.05);
    sun.target.position.set(W / 2, 0, L / 2);
    const sc = sun.shadow.camera;
    sc.left = -span; sc.right = span; sc.top = span; sc.bottom = -span; sc.near = 10; sc.far = span * 5;
    sc.updateProjectionMatrix();
    render();
  }

  // Orthographic views frame the room (top) or one wall (side) with a margin, at any aspect ratio.
  function fitOrtho() {
    const { w, h } = size();
    const aspect = w / h;
    const W = state.W, L = state.L;
    const viewW = mode === 'top' ? W + 80 : (sideWall === 'N' || sideWall === 'S' ? W : L) + 80;
    const viewH = mode === 'top' ? L + 80 : WALL_H + 70;
    let hw = viewW / 2, hh = viewH / 2;
    if (hw / hh > aspect) hh = hw / aspect; else hw = hh * aspect;
    camera.left = -hw; camera.right = hw; camera.top = hh; camera.bottom = -hh;
    camera.updateProjectionMatrix();
  }

  function setView(m, side) {
    mode = m; sideWall = side || sideWall;
    const { w, h } = size();
    const W = state.W, L = state.L, span = Math.max(W, L);
    const target = new THREE.Vector3(W / 2, mode === 'top' ? 0 : 70, L / 2);
    if (controls) { controls.dispose(); controls = null; }
    if (mode === 'dollhouse') {
      camera = new THREE.PerspectiveCamera(38, w / h, 5, 20000);
      const r = span * 2.05, phi = 0.92, theta = 0.62;
      camera.position.set(target.x + r * Math.sin(phi) * Math.sin(theta), target.y + r * Math.cos(phi), target.z + r * Math.sin(phi) * Math.cos(theta));
    } else {
      camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 20000);
      fitOrtho();
      if (mode === 'top') {
        camera.up.set(0, 0, -1);
        camera.position.set(W / 2, 2000, L / 2);
      } else {
        target.y = WALL_H / 2;
        const dirs = { N: [0, 1], S: [0, -1], W: [1, 0], E: [-1, 0] };
        const [dx, dz] = dirs[sideWall];
        camera.position.set(W / 2 + dx * 3000, WALL_H / 2, L / 2 + dz * 3000);
      }
    }
    camera.lookAt(target);
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.copy(target);
    controls.enableDamping = false;
    controls.enableRotate = mode === 'dollhouse';
    controls.screenSpacePanning = true;
    if (mode === 'dollhouse') {
      controls.maxPolarAngle = Math.PI * 0.47; // never below the floor
      controls.minDistance = span * 0.5;
      controls.maxDistance = span * 4;
    } else {
      controls.minZoom = 0.5;
      controls.maxZoom = 4;
    }
    controls.update();
    controls.addEventListener('change', render);
    resize();
  }

  function resize() {
    const { w, h } = size();
    renderer.setSize(w, h, false);
    if (camera && camera.isPerspectiveCamera) { camera.aspect = w / h; camera.updateProjectionMatrix(); }
    if (camera && camera.isOrthographicCamera) fitOrtho();
    render();
  }
  const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(() => resize()) : null;
  if (ro) ro.observe(host);

  function zoom(factor) {
    if (!camera || !controls) return;
    if (camera.isPerspectiveCamera) {
      const off = camera.position.clone().sub(controls.target);
      const len = Math.min(controls.maxDistance, Math.max(controls.minDistance, off.length() / factor));
      camera.position.copy(controls.target).add(off.setLength(len));
    } else {
      camera.zoom = Math.min(controls.maxZoom, Math.max(controls.minZoom, camera.zoom * factor));
      camera.updateProjectionMatrix();
    }
    controls.update();
    render();
  }

  // tap to select: a pointer that goes down and up without moving picks what's under it
  let down = null;
  const ray = new THREE.Raycaster();
  const onDown = (e) => { down = { x: e.clientX, y: e.clientY }; };
  const onUp = (e) => {
    if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 5) { down = null; return; }
    down = null;
    const rect = renderer.domElement.getBoundingClientRect();
    const v = new THREE.Vector2(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
    ray.setFromCamera(v, camera);
    const hits = ray.intersectObjects(pickables, true);
    const hit = hits.find((x) => x.object.userData && (x.object.userData.ref_id || x.object.userData.slot_id));
    if (!hit) return;
    const d = hit.object.userData;
    if (d.ref_id && handlers.current.onPickItem) handlers.current.onPickItem(d.ref_id);
    if (d.slot_id && handlers.current.onPickSlot) handlers.current.onPickSlot(d.slot_id);
  };
  renderer.domElement.addEventListener('pointerdown', onDown);
  renderer.domElement.addEventListener('pointerup', onUp);

  return {
    build, setView, render, zoom,
    dispose() {
      if (ro) ro.disconnect();
      if (controls) controls.dispose();
      renderer.domElement.removeEventListener('pointerdown', onDown);
      renderer.domElement.removeEventListener('pointerup', onUp);
      disposeTree(scene);
      matCache.forEach((m) => m.dispose());
      transient.forEach((m) => m.dispose());
      floorTex.dispose();
      renderer.dispose();
      if (renderer.forceContextLoss) renderer.forceContextLoss();
      if (renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
    },
  };
}

const VIEW_SIDES = [['N', 'North wall'], ['E', 'East wall'], ['S', 'South wall'], ['W', 'West wall']];

function Room3D({ room, placements, slots, products, selectedId, selectedSlotId, onPickItem, onPickSlot, hint }) {
  const host = useRef(null);
  const eng = useRef(null);
  const handlers = useRef({});
  handlers.current = { onPickItem, onPickSlot };
  const [status, setStatus] = useState('loading');
  const [view, setView] = useState('dollhouse');
  const [side, setSide] = useState('N');
  useEffect(() => {
    let alive = true;
    loadThree().then((THREE) => {
      if (!alive || !host.current) return;
      try { eng.current = createScene(THREE, host.current, handlers); setStatus('ready'); } catch (e) { setStatus('error'); }
    }).catch(() => { if (alive) setStatus('error'); });
    return () => { alive = false; if (eng.current) eng.current.dispose(); eng.current = null; };
  }, []);
  // Rebuild only when what's drawn changes, not on every parent render.
  const er = { width_cm: room.width_cm, length_cm: room.length_cm, door: room.door, windows: room.windows || [] };
  const sig = JSON.stringify([er, placements || [], slots || [], products || [], selectedId || null, selectedSlotId || null]);
  const latest = useRef(null);
  latest.current = { room: er, placements, slots, products, selectedId, selectedSlotId };
  useEffect(() => {
    if (status !== 'ready' || !eng.current) return;
    eng.current.build(latest.current);
  }, [status, sig]);
  useEffect(() => {
    if (status !== 'ready' || !eng.current) return;
    eng.current.setView(view, side);
  }, [status, view, side, room.width_cm, room.length_cm]);
  const names = (placements || []).map((p) => p.name);
  const added = (products || []).map((p) => p.title);
  const label = `3D view of ${room.name || 'the room'}, ${room.width_cm} by ${room.length_cm} cm${names.length ? `, with ${names.join(', ')}` : ''}${added.length ? `, plus ${added.join(', ')}` : ''}.`;
  return html`<div class="view3d-wrap">
    <div class="view3d" ref=${host} role="img" aria-label=${label}>
      ${status === 'loading' && html`<div class="view3d-msg">Loading 3D view…</div>`}
      ${status === 'error' && html`<div class="view3d-msg">The 3D view couldn't load here. The plan view still works.</div>`}
      ${status === 'ready' && html`<div class="view3d-zoom" role="group" aria-label="Zoom">
        <button type="button" class="icon-btn" aria-label="Zoom in" onClick=${() => eng.current && eng.current.zoom(1.25)}>+</button>
        <button type="button" class="icon-btn" aria-label="Zoom out" onClick=${() => eng.current && eng.current.zoom(0.8)}>−</button>
      </div>`}
    </div>
    <div class="view3d-bar" role="toolbar" aria-label="3D view controls">
      <${Seg} label="Camera" value=${view} onChange=${setView} options=${[['dollhouse', 'Dollhouse'], ['top', 'Top view'], ['side', 'Side view']]} />
      ${view === 'side' && html`<label class="sr-only" for="side3d">Wall to look at</label><select id="side3d" class="select side-select" value=${side} onChange=${(e) => setSide(e.target.value)}>${VIEW_SIDES.map(([v, l]) => html`<option value=${v}>${l}</option>`)}</select>`}
      <span class="tiny faint">${view === 'dollhouse' ? 'Drag to orbit, scroll or pinch to zoom.' : 'Scroll to zoom, right-drag to pan.'}${hint ? ` ${hint}` : ''}</span>
    </div>
  </div>`;
}

// The plan and the 3D room behind one switch; the choice is remembered for this visit.
function PlanOr3D(props) {
  const [mode, setMode] = useState(() => { try { return sessionStorage.getItem('removaters.view') || '2d'; } catch (e) { return '2d'; } });
  const pick = (m) => { setMode(m); try { sessionStorage.setItem('removaters.view', m); } catch (e) { /* optional */ } };
  return html`<div class="stack" style="gap:10px">
    <div class="spread view-switch">
      <${Seg} label="View" value=${mode} onChange=${pick} options=${[['2d', 'Plan'], ['3d', '3D room']]} />
      ${props.extra || null}
    </div>
    ${mode === '3d'
      ? html`<${Room3D} room=${props.room} placements=${props.placements} slots=${props.slots} products=${props.products} selectedId=${props.selectedId} selectedSlotId=${props.selectedSlotId}
          onPickItem=${props.onSelect} onPickSlot=${props.onSlotClick} hint=${props.hint3d} />`
      : html`<${Plan} ...${props} />`}
  </div>`;
}

/* art3d.js */
/* 3D product pictures. One hidden three.js renderer draws each piece once (the same furniture models as the
   3D room view) into a cached image for cards and lists, and Product3D is a small interactive turntable for
   the preview dialog. Falls back to the 2D plan symbol when WebGL or three.js is unavailable. */
const OPTION_COLOURS = [
  ['whitewash', '#e9e4da'], ['ivory', '#efe9dd'], ['boucle', '#efe9dd'], ['white', '#f2f2ee'], ['charcoal', '#4a4a4a'], ['black', '#3f3f3f'],
  ['smoked', '#8a6a4c'], ['walnut', '#7a5a3e'], ['dark', '#6f553f'], ['oak', '#d9be95'], ['natural', '#d9be95'], ['oiled', '#cfae80'],
  ['grey', '#aab0b2'], ['navy', '#3e4f6e'], ['indigo', '#3f4a7a'], ['forest', '#5d7a63'], ['green', '#86a88d'], ['linen', '#e3d6be'],
  ['sand', '#e3d6be'], ['red', '#a84432'], ['ochre', '#c98b45'], ['terracotta', '#cf8466'], ['blue', '#7c95b8'],
];
const MATERIAL_FINISH = {
  metal: [0.35, 0.65], glass: [0.12, 0.15], leather: [0.42, 0], rattan: [0.92, 0], fabric: [0.96, 0],
  'solid wood': [0.68, 0], 'engineered wood': [0.55, 0],
};

// The colour an option implies, read from its name ("Smoked oak", "Velvet forest"), or null.
function optionColour(product, optionId) {
  const o = (product.options || []).find((x) => x.id === optionId);
  if (!o) return null;
  const name = String(o.name || '').toLowerCase();
  const hit = OPTION_COLOURS.find(([k]) => name.includes(k));
  return hit ? hit[1] : null;
}

function artSpec(product, optionId) {
  return {
    category: product.category,
    w: Math.max(10, product.width_cm || 60), d: Math.max(10, product.depth_cm || 60),
    h: Math.max(10, product.height_cm || DEFAULT_H[product.category] || 60),
    colour: optionColour(product, optionId) || COLOUR_HEX[product.colour] || OWNED_COLOUR[product.category] || '#cfb18b',
    material: product.material || '',
  };
}
const artKey = (s) => [s.category, s.w, s.d, s.h, s.colour, s.material].join('|');

// Materials for one piece: the main colour picks up the product's material (metal shines, fabric is matte).
function materialSet(THREE, cache, spec) {
  const finish = MATERIAL_FINISH[spec.material];
  return {
    get(colour, rough, metalness) {
      const r = finish && colour === spec.colour ? finish[0] : rough;
      const m = finish && colour === spec.colour ? finish[1] : metalness;
      const key = `${colour}|${r}|${m || 0}`;
      // Hex colours are sRGB; three.js lights in linear space, so convert or everything renders washed out.
      if (!cache.has(key)) cache.set(key, new THREE.MeshStandardMaterial({ color: new THREE.Color(colour).convertSRGBToLinear(), roughness: r == null ? 0.8 : r, metalness: m || 0 }));
      return cache.get(key);
    },
  };
}

// A small studio: soft sky light, a key light with shadows, and a floor that only shows the shadow.
function studio(THREE, renderer) {
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8f877b, 1.0));
  const key = new THREE.DirectionalLight(0xfff6ea, 1.25);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  key.shadow.bias = -0.0005;
  scene.add(key);
  scene.add(key.target);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.ShadowMaterial({ opacity: 0.2 }));
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);
  const holder = new THREE.Group();
  scene.add(holder);
  const camera = new THREE.PerspectiveCamera(28, 4 / 3, 1, 10000);
  // Puts a piece in the middle of the frame, seen from the front-right, a little above.
  const frame = (piece, aspect) => {
    holder.children.slice().forEach((c) => { holder.remove(c); c.traverse((o) => { if (o.geometry) o.geometry.dispose(); }); });
    holder.add(piece);
    const box = new THREE.Box3().setFromObject(piece);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const radius = Math.max(20, size.length() / 2);
    camera.aspect = aspect;
    const vfov = (camera.fov * Math.PI) / 180;
    const fit = Math.min(vfov, 2 * Math.atan(Math.tan(vfov / 2) * aspect));
    const dist = (radius / Math.sin(fit / 2)) * 1.02;
    const dir = new THREE.Vector3(0.72, 0.5, 1).normalize();
    camera.position.copy(center).add(dir.multiplyScalar(dist));
    camera.near = Math.max(0.5, dist / 60);
    camera.far = dist * 6;
    camera.lookAt(center);
    camera.updateProjectionMatrix();
    floor.scale.set(radius * 8, radius * 8, 1);
    floor.position.set(center.x, 0, center.z);
    key.position.set(center.x + radius * 1.4, radius * 3.2, center.z + radius * 2.2);
    key.target.position.copy(center);
    const sc = key.shadow.camera;
    sc.left = -radius * 1.6; sc.right = radius * 1.6; sc.top = radius * 1.6; sc.bottom = -radius * 1.6;
    sc.near = 1; sc.far = radius * 10;
    sc.updateProjectionMatrix();
    return center;
  };
  return { scene, camera, frame };
}

const Art3D = (() => {
  const cache = new Map();
  let ctx = null;
  let failed = false;
  let chain = Promise.resolve();
  const W = 320, H = 240;

  function init(THREE) {
    if (ctx) return ctx;
    const canvas = document.createElement('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    renderer.setSize(W, H, false);
    ctx = { THREE, renderer, ...studio(THREE, renderer), mats: new Map() };
    return ctx;
  }

  function draw(spec) {
    const { THREE, renderer, scene, camera, frame, mats } = ctx;
    const piece = buildPiece(THREE, spec.category, spec.w, spec.d, spec.h, spec.colour, materialSet(THREE, mats, spec));
    piece.traverse((o) => { if (o.isMesh) { o.castShadow = true; } });
    frame(piece, W / H);
    renderer.render(scene, camera);
    return renderer.domElement.toDataURL('image/png');
  }

  return {
    key: artKey,
    cached: (spec) => cache.get(artKey(spec)) || null,
    get failed() { return failed; },
    // Renders one at a time, yielding between pictures so scrolling stays smooth.
    render(spec) {
      const k = artKey(spec);
      if (cache.has(k)) return Promise.resolve(cache.get(k));
      if (failed) return Promise.reject(new Error('3D unavailable'));
      const job = chain.then(() => new Promise((resolve) => setTimeout(resolve, 0))).then(() => {
        if (cache.has(k)) return cache.get(k);
        return loadThree().then((THREE) => {
          init(THREE);
          const url = draw(spec);
          cache.set(k, url);
          return url;
        });
      });
      chain = job.catch(() => { failed = true; });
      return job;
    },
  };
})();

// A product (or one of your own pieces) as a 3D picture; the 2D symbol stands in while it draws or if 3D can't run.
function Art({ spec, size, alt, photo }) {
  const k = artKey(spec);
  const [src, setSrc] = useState(() => Art3D.cached(spec));
  const [broken, setBroken] = useState(null);
  const usePhoto = photo && broken !== photo;
  useEffect(() => {
    let alive = true;
    const have = Art3D.cached(spec);
    setSrc(have);
    if (!have && !usePhoto) Art3D.render(spec).then((u) => { if (alive) setSrc(u); }).catch(() => { if (alive) setSrc('fail'); });
    return () => { alive = false; };
  }, [k, usePhoto]);
  const w = size || 96, h = Math.round(w * 0.75);
  // A photo that won't load falls back to the 3D picture.
  if (usePhoto) return html`<img class="art photo" src=${photo} width=${w} height=${h} alt=${alt} loading="lazy" onError=${() => setBroken(photo)} />`;
  if (src && src !== 'fail') return html`<img class="art" src=${src} width=${w} height=${h} alt=${alt} />`;
  return html`<span class=${`art art-fallback ${src === 'fail' ? '' : 'loading'}`} style=${`width:${w}px;height:${h}px`} role="img" aria-label=${alt}>
    <${SymbolIcon} category=${spec.category} w=${spec.w} d=${spec.d} size=${Math.round(h * 0.8)} /></span>`;
}

function ProductArt({ product, optionId, size }) {
  return html`<${Art} spec=${artSpec(product, optionId)} size=${size} photo=${product.image_url || null} alt=${`${product.title}: 3D picture, ${product.width_cm} by ${product.depth_cm} by ${product.height_cm} cm`} />`;
}

function PieceArt({ category, w, d, h, size }) {
  const spec = { category, w: Math.max(10, w || 60), d: Math.max(10, d || 60), h: h || DEFAULT_H[category] || 60, colour: OWNED_COLOUR[category] || '#cfb18b', material: '' };
  return html`<${Art} spec=${spec} size=${size} alt=${`${Engine.label(category)}, ${spec.w} by ${spec.d} cm`} />`;
}

// Interactive turntable for one product: drag to turn it, scroll or pinch to zoom.
function createProductViewer(THREE, host, spec) {
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  host.appendChild(renderer.domElement);
  Object.assign(renderer.domElement.style, { display: 'block', width: '100%', height: '100%', touchAction: 'none' });
  const { scene, camera, frame } = studio(THREE, renderer);
  const mats = new Map();
  const piece = buildPiece(THREE, spec.category, spec.w, spec.d, spec.h, spec.colour, materialSet(THREE, mats, spec));
  const size = () => ({ w: host.clientWidth || 400, h: host.clientHeight || 300 });
  const { w, h } = size();
  renderer.setSize(w, h, false);
  const center = frame(piece, w / h);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.copy(center);
  controls.enablePan = false;
  controls.enableDamping = true;
  controls.maxPolarAngle = Math.PI * 0.49;
  const dist = camera.position.distanceTo(center);
  controls.minDistance = dist * 0.45;
  controls.maxDistance = dist * 2.2;
  const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  controls.autoRotate = !still;
  controls.autoRotateSpeed = 1.6;
  controls.addEventListener('start', () => { controls.autoRotate = false; });
  controls.update();
  let raf = 0, alive = true;
  const loop = () => { if (!alive) return; controls.update(); renderer.render(scene, camera); raf = requestAnimationFrame(loop); };
  loop();
  const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(() => {
    const s = size();
    renderer.setSize(s.w, s.h, false);
    camera.aspect = s.w / s.h;
    camera.updateProjectionMatrix();
  }) : null;
  if (ro) ro.observe(host);
  return {
    dispose() {
      alive = false;
      cancelAnimationFrame(raf);
      if (ro) ro.disconnect();
      controls.dispose();
      scene.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
      mats.forEach((m) => m.dispose());
      renderer.dispose();
      if (renderer.forceContextLoss) renderer.forceContextLoss();
      if (renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
    },
  };
}

function Product3D({ product, optionId }) {
  const host = useRef(null);
  const [status, setStatus] = useState('loading');
  const spec = artSpec(product, optionId);
  const k = artKey(spec);
  useEffect(() => {
    let alive = true, eng = null;
    setStatus('loading');
    loadThree().then((THREE) => {
      if (!alive || !host.current) return;
      try { eng = createProductViewer(THREE, host.current, spec); setStatus('ready'); } catch (e) { setStatus('error'); }
    }).catch(() => { if (alive) setStatus('error'); });
    return () => { alive = false; if (eng) eng.dispose(); };
  }, [k]);
  return html`<div class="product3d" ref=${host} role="img" aria-label=${`3D model of ${product.title}, ${product.width_cm} by ${product.depth_cm} by ${product.height_cm} cm. Drag to turn it.`}>
    ${status === 'loading' && html`<div class="view3d-msg">Loading 3D model…</div>`}
    ${status === 'error' && html`<div class="view3d-msg"><${ProductArt} product=${product} optionId=${optionId} size=${220} /></div>`}
  </div>`;
}

/* Storage. With the artifact database available and writable, rooms sync to the viewer's account
   (private per person) and seller listings are shared. Otherwise everything saves in this browser,
   and shared listings are still shown when the database is readable. */
const SESSION = Math.random().toString(36).slice(2, 10);
const newId = (p) => `${p}-${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;
const nowIso = () => new Date().toISOString();
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const byUpdated = (a, b) => String(b.updated_at || '').localeCompare(String(a.updated_at || ''));

const LS = {
  key: (k) => `removaters.v1.${k}`,
  get(k, d) { try { const v = localStorage.getItem(LS.key(k)); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(LS.key(k), JSON.stringify(v)); return true; } catch (e) { return false; } },
};

const Toast = (() => {
  let list = [];
  const subs = new Set();
  const emit = () => subs.forEach((f) => f());
  return {
    show(msg, kind) {
      const id = Math.random();
      list = [...list.slice(-2), { id, msg, kind: kind || 'info' }];
      emit();
      setTimeout(() => { list = list.filter((t) => t.id !== id); emit(); }, kind === 'bad' ? 6000 : 3800);
    },
    get: () => list,
    subscribe(f) { subs.add(f); return () => subs.delete(f); },
  };
})();
const toast = (msg, kind) => Toast.show(msg, kind);

const Data = (() => {
  const state = {
    ready: false, mode: 'local', canRead: false, uid: null,
    profile: { persona: 'renter' }, rooms: [], seller: null, otherSellers: [], reviewDocs: {}, myReviews: {},
    salesDocs: {}, mySales: {},
  };
  const subs = new Set();
  let db = null;
  let uid = null;
  const queues = {};
  const emit = () => subs.forEach((f) => f());
  const set = (patch) => { Object.assign(state, patch); emit(); };

  async function init() {
    let d = null, u = null;
    try {
      if (window.claude && typeof window.claude.use === 'function') [d, u] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    } catch (e) { d = null; u = null; }
    let id = null, canWrite = null;
    if (u) {
      try { id = await u.id(); } catch (e) { id = null; }
      try { canWrite = await u.can('data.write'); } catch (e) { canWrite = null; }
    }
    const cloud = Boolean(d && id && canWrite !== false);
    if (cloud) uid = id;
    if (d) { db = d; watchShared(); }
    if (cloud) await startCloud(); else startLocal();
  }

  function watchShared() {
    db.collection('sellers').onSnapshot((snap) => {
      const all = snap.docs.map((doc) => ({ ...doc.data(), id: doc.id }));
      const patch = { canRead: true, otherSellers: all.filter((s) => s.id !== uid) };
      if (state.mode === 'cloud') patch.seller = all.find((s) => s.id === uid) || null;
      set(patch);
    }, () => {});
    // Units sold per product, one document per buyer (no names, just product keys and totals), for seller insights.
    db.collection('sales').onSnapshot((snap) => {
      const docs = {};
      snap.docs.forEach((doc) => { docs[doc.id] = doc.data(); });
      const patch = { salesDocs: docs };
      if (state.mode === 'cloud') patch.mySales = (docs[uid] && docs[uid].items) || {};
      set(patch);
    }, () => {});
    db.collection('reviews').onSnapshot((snap) => {
      const docs = {};
      snap.docs.forEach((doc) => { docs[doc.id] = doc.data(); });
      const patch = { reviewDocs: docs };
      if (state.mode === 'cloud') patch.myReviews = (docs[uid] && docs[uid].items) || {};
      set(patch);
    }, () => {});
  }

  async function startCloud() {
    const profileRef = db.doc(`data/users/${uid}/profile`);
    let profile = { persona: 'renter' };
    try { const snap = await profileRef.get(); if (snap.exists) profile = { ...profile, ...snap.data() }; } catch (e) { /* defaults */ }
    set({ mode: 'cloud', uid, profile });
    profileRef.collection('rooms').onSnapshot((snap) => {
      if (state.mode !== 'cloud') return;
      const fromStore = snap.docs.map((doc) => ({ ...doc.data(), id: doc.id }));
      // Edits still waiting to be written win over what the store last confirmed.
      const rooms = fromStore.map((r) => dirty.get(r.id) || r);
      for (const [id, r] of dirty) if (!rooms.some((x) => x.id === id)) rooms.push(r);
      set({ rooms: rooms.filter((r) => !deleted.has(r.id)).sort(byUpdated), ready: true });
    }, () => { fallbackToLocal(); set({ ready: true }); });
    setTimeout(() => { if (!state.ready) set({ ready: true }); }, 5000);
  }

  function startLocal() {
    set({
      mode: 'local',
      profile: LS.get('profile', { persona: 'renter' }),
      rooms: LS.get('rooms', []).sort(byUpdated),
      seller: LS.get('seller', null),
      myReviews: LS.get('reviews', {}),
      mySales: LS.get('sales', {}),
      ready: true,
    });
  }

  function enqueue(path, fn) {
    const prev = queues[path] || Promise.resolve();
    const next = prev.then(fn, fn);
    queues[path] = next.catch(() => {});
    return next;
  }

  async function cloudSet(path, body) {
    try {
      await enqueue(path, () => db.doc(path).set(body));
      return true;
    } catch (err) {
      if (err && err.code === 'unavailable') {
        await sleep(400 + Math.random() * 600);
        try { await db.doc(path).set(body); return true; } catch (e2) { return writeFailed(e2); }
      }
      return writeFailed(err);
    }
  }

  async function cloudDelete(path) {
    try { await enqueue(path, () => db.doc(path).delete()); return true; } catch (err) { return writeFailed(err); }
  }

  function writeFailed(err) {
    const code = err && err.code;
    if (code === 'quota_exceeded') toast('Storage is full. Delete a room you no longer need, then try again.', 'bad');
    else if (['invalid_argument', 'not_granted', 'revoked', 'capability_disabled', 'capability_removed'].includes(code)) fallbackToLocal();
    else toast("Couldn't save just now. Check your connection and try again.", 'bad');
    return false;
  }

  function fallbackToLocal() {
    if (state.mode !== 'cloud') return;
    LS.set('rooms', state.rooms);
    LS.set('profile', state.profile);
    if (state.seller) LS.set('seller', { ...state.seller, id: localSellerId() });
    LS.set('reviews', state.myReviews);
    LS.set('sales', state.mySales);
    set({ mode: 'local', seller: state.seller ? { ...state.seller, id: localSellerId() } : null });
    toast("This link can't save to your account, so changes now save in this browser.", 'bad');
  }

  function localSellerId() {
    let id = LS.get('sellerId', null);
    if (!id) { id = newId('local-seller'); LS.set('sellerId', id); }
    return id;
  }

  // Rooms update on screen at once; account writes are coalesced so typing doesn't spam the store.
  const dirty = new Map();
  const deleted = new Set();
  const timers = {};
  function writeRoomNow(id) {
    clearTimeout(timers[id]);
    const latest = dirty.get(id);
    if (!latest) return Promise.resolve(true);
    return cloudSet(`data/users/${uid}/profile/rooms/${id}`, latest).then((ok) => {
      if (dirty.get(id) === latest) dirty.delete(id);
      return ok;
    });
  }
  function flush() { for (const id of [...dirty.keys()]) writeRoomNow(id); }
  window.addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });

  function saveRoom(room, opts) {
    const r = { ...room, updated_at: nowIso(), writer: SESSION };
    set({ rooms: [r, ...state.rooms.filter((x) => x.id !== r.id)] });
    if (state.mode !== 'cloud') { LS.set('rooms', state.rooms); return; }
    dirty.set(r.id, r);
    clearTimeout(timers[r.id]);
    if (opts && opts.now) writeRoomNow(r.id);
    else timers[r.id] = setTimeout(() => writeRoomNow(r.id), 500);
  }

  function deleteRoom(id) {
    set({ rooms: state.rooms.filter((x) => x.id !== id) });
    if (state.mode !== 'cloud') { LS.set('rooms', state.rooms); return; }
    clearTimeout(timers[id]);
    dirty.delete(id);
    deleted.add(id);
    cloudDelete(`data/users/${uid}/profile/rooms/${id}`);
  }

  function saveProfile(patch) {
    const profile = { ...state.profile, ...patch };
    set({ profile });
    if (state.mode === 'cloud') return cloudSet(`data/users/${uid}/profile`, profile);
    LS.set('profile', profile);
    return Promise.resolve(true);
  }

  function saveSeller(seller) {
    const id = state.mode === 'cloud' ? uid : localSellerId();
    const s = { ...seller, id, updated_at: nowIso() };
    set({ seller: s });
    if (state.mode === 'cloud') return cloudSet(`sellers/${uid}`, s);
    LS.set('seller', s);
    return Promise.resolve(true);
  }

  function saveReview(key, review) {
    const items = { ...state.myReviews };
    if (review) items[key] = review; else delete items[key];
    set({ myReviews: items });
    if (state.mode === 'cloud') return cloudSet(`reviews/${uid}`, { items, updated_at: nowIso() });
    LS.set('reviews', items);
    return Promise.resolve(true);
  }

  // Adds an order's pieces to this buyer's sales tally, which sellers read for their insights.
  function recordSales(order) {
    const items = { ...state.mySales };
    for (const st of order.stores || []) {
      for (const l of st.lines || []) {
        const cur = items[l.product_key] || { units: 0, revenue_cents: 0, title: l.title, seller_id: l.seller_id };
        items[l.product_key] = { ...cur, units: cur.units + 1, revenue_cents: cur.revenue_cents + l.price_cents, last_at: order.created_at };
      }
    }
    set({ mySales: items });
    if (state.mode === 'cloud') return cloudSet(`sales/${uid}`, { items, updated_at: nowIso() });
    LS.set('sales', items);
    return Promise.resolve(true);
  }

  return {
    state, init, saveRoom, deleteRoom, saveProfile, saveSeller, saveReview, recordSales,
    subscribe(f) { subs.add(f); return () => subs.delete(f); },
    myReviewer: () => (state.mode === 'cloud' ? uid : 'me'),
  };
})();

/* Claude inside the page (the artifact's sample capability). Every AI feature checks for it first and
   falls back or hides when it isn't there, for example when the page is hosted outside Claude. */
const AI = (() => {
  let got = null;
  let off = false;
  const subs = new Set();
  const HIDE = ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'];
  const get = () => {
    if (!got) {
      got = (window.claude && typeof window.claude.use === 'function'
        ? Promise.resolve().then(() => window.claude.use('sample'))
        : Promise.resolve(null)).catch(() => null);
    }
    return got;
  };
  const call = async (kind, input, opts) => {
    const s = await get();
    if (!s || off) throw { code: 'unavailable' };
    try { return kind === 'json' ? await s.json(input, opts) : await s(input, opts); } catch (e) {
      if (e && HIDE.includes(e.code)) { off = true; subs.forEach((f) => f()); }
      throw e;
    }
  };
  const COPY = {
    not_granted: "Claude isn't allowed on this page, so this feature is off.",
    sampling_disabled: "Claude isn't available on this account.",
    rate_limited: "Claude is busy or you've reached a usage limit. Try again in a minute.",
    session_expired: 'Sign in to Claude again, then try again.',
    image_rejected: "Claude couldn't read that image. Try a JPG or PNG.",
    refused: 'Claude declined this one. Try a different photo or text.',
    invalid_json: 'The answer came back garbled. Try again.',
    empty_completion: "Claude didn't answer. Try again with less text.",
    prompt_too_large: "That's too much text. Paste just the product details.",
    unavailable: "Claude isn't available here.",
  };
  return {
    get,
    available: async () => Boolean(await get()) && !off,
    images: async () => {
      const s = await get();
      if (!s || off) return false;
      try { const l = await s.limits(); return Boolean(l && l.images); } catch (e) { return false; }
    },
    json: (input, opts) => call('json', input, opts),
    text: (input, opts) => call('text', input, opts),
    message: (e) => COPY[e && e.code] || "Claude couldn't finish that. Try again.",
    isOff: () => off,
    subscribe: (f) => { subs.add(f); return () => subs.delete(f); },
  };
})();

// null while checking, then true or false. With `images`, true only when photos can be sent too.
function useAI(images) {
  const [ok, setOk] = useState(null);
  useEffect(() => {
    let alive = true;
    const check = () => (images ? AI.images() : AI.available()).then((v) => { if (alive) setOk(Boolean(v) && !AI.isOff()); });
    check();
    const off = AI.subscribe(check);
    return () => { alive = false; off(); };
  }, [images]);
  return ok;
}

const firstMatch = (list, text) => { for (const [v, re] of list) if (re.test(text)) return v; return ''; };

  return Math.round(u === 'mm' ? v / 10 : u === 'm' ? v * 100 : v);
};

// A rough first pass over pasted product-page text. Claude does better, but this works everywhere.
function parseListingText(text) {
  const src = String(text || '').slice(0, 6000);
  const lines = src.split(/\n+/).map((l) => l.trim()).filter(Boolean);
  const out = {};
  const title = lines.find((l) => l.length >= 3 && l.length <= 80 && !/\$|\bcm\b|\bmm\b/i.test(l));
  if (title) out.title = title.replace(/\s+/g, ' ');
  out.category = firstMatch(CAT_WORDS, out.title || '') || firstMatch(CAT_WORDS, src);
  const num = '(\\d{1,4}(?:\\.\\d+)?)';
  const grab = (re) => { const m = src.match(re); return m ? toCm(m[1], m[2]) : NaN; };
  let w = grab(new RegExp(`\\b(?:W|Width)\\s*[:=]?\\s*${num}\\s*(cm|mm|m)?\\b`, 'i'));
  let d = grab(new RegExp(`\\b(?:D|Depth)\\s*[:=]?\\s*${num}\\s*(cm|mm|m)?\\b`, 'i'));
  let h = grab(new RegExp(`\\b(?:H|Height)\\s*[:=]?\\s*${num}\\s*(cm|mm|m)?\\b`, 'i'));
  if (!w) w = grab(new RegExp(`${num}\\s*(cm|mm|m)?\\s*(?:wide|w)\\b`, 'i'));
  if (!d) d = grab(new RegExp(`${num}\\s*(cm|mm|m)?\\s*(?:deep|d)\\b`, 'i'));
  if (!h) h = grab(new RegExp(`${num}\\s*(cm|mm|m)?\\s*(?:high|tall|h)\\b`, 'i'));
  if (!(w && d && h)) {
    const m = src.match(new RegExp(`${num}\\s*(?:cm|mm)?\\s*[x×]\\s*${num}\\s*(?:cm|mm)?\\s*[x×]\\s*${num}\\s*(cm|mm)?`, 'i'));
    if (m) { w = toCm(m[1], m[4]); d = toCm(m[2], m[4]); h = toCm(m[3], m[4]); }
  }
  if (w > 0) out.width_cm = w;
  if (d > 0) out.depth_cm = d;
  if (h > 0) out.height_cm = h;
  const price = src.match(/(?:^|[^+\d])\$\s?(\d{1,3}(?:,\d{3})+|\d+)(\.\d{2})?/);
  if (price) out.price = Number(price[1].replace(/,/g, '') + (price[2] || ''));
  const line = (re) => { const m = src.match(re); return m ? m[1] : ''; };
  out.colour = normColour(line(/colou?r\s*[:\-]\s*([^\n]+)/i)) || firstMatch(COLOUR_WORDS, src);
  out.material = normMaterial(line(/materials?\s*[:\-]\s*([^\n]+)/i)) || firstMatch(MATERIAL_WORDS, src);
  out.styles = normStyles(src.match(/\b(scandi\w*|nordic|japandi|industrial|mid[- ]?century|coastal|hamptons|boho\w*|minimal\w*)\b/gi) || []);
  out.renter_friendly = !(/\b(wall[- ]?mount\w*|must be (fixed|screwed)|fix(ed)? to (the )?wall|drilling required)\b/i.test(src) && !/\b(no drilling|without drilling|free-?standing)\b/i.test(src));
  return out;
}

// What a listing draft needs before it can go live; also used for every CSV row.
function listingProblems(d) {
  const out = [];
  if (!String(d.title || '').trim()) out.push('Add a title.');
  if (!E.CATEGORIES.includes(d.category)) out.push('Pick a type of furniture.');
  for (const [n, v] of [['Width', d.width_cm], ['Depth', d.depth_cm], ['Height', d.height_cm]]) if (!isWhole(v) || v < 1 || v > 400) out.push(`${n} must be a whole number from 1 to 400 cm.`);
  if (!(d.price > 0) || d.price > 100000) out.push('Price must be more than $0.');
  if (!CAT.COLOURS.includes(d.colour)) out.push(`Colour must be one of: ${CAT.COLOURS.join(', ')}.`);
  if (!CAT.MATERIALS.includes(d.material)) out.push(`Material must be one of: ${CAT.MATERIALS.join(', ')}.`);
  if (!(d.styles || []).length) out.push(`Add at least one style: ${CAT.STYLES.join(', ')}.`);
  if (d.product_url === null) out.push('Product page link must be a web link, like https://yourshop.com.au/desk.');
  return out;
}

/* Moving the suggested spots (the purple dotted outlines). Moving one turns the layout into
   "Your edit" and pins every spot where it is; anything bought for a spot moves with it. */
function spotTools(room, update, layout, beforeChange) {
  const er = engineRoom(room);
  const goal = room.goal;
  const items = goal === 'replace' ? (room.items || []).filter((i) => i.keep) : room.items || [];
  const others = (id) => layout.slots.filter((s) => s.id !== id);
  const errorsFor = (spot) => E.validateSpot(er, layout.placements, others(spot.id), spot);
  const save = (slots, note) => {
    if (beforeChange) beforeChange();
    const rebuilt = E.rebuildLayout(er, items, layout.placements, goal, 'custom', slots);
    update({ layouts: [...room.layouts.filter((l) => l.variant !== 'custom'), { ...rebuilt, id: 'custom', variant: 'custom', slots_custom: true }], chosen_layout_id: 'custom' });
    if (note) toast(note);
  };
  const place = (id, patch) => {
    const spot = layout.slots.find((s) => s.id === id);
    if (!spot) return false;
    const home = spot.home || { x: spot.x, y: spot.y, w: spot.w, d: spot.d, wall: spot.wall || null };
    const moved = { ...spot, ...patch, home };
    moved.wall = E.spotWall(er, moved);
    const errs = errorsFor(moved);
    if (errs.length) { toast(`Can't put it there: ${errs[0]}`, 'bad'); return false; }
    save(layout.slots.map((s) => (s.id === id ? moved : s)));
    return true;
  };
  const rotate = (id) => {
    const s = layout.slots.find((x) => x.id === id);
    if (!s) return;
    const W = room.width_cm, L = room.length_cm;
    const cx = s.x + s.w / 2, cy = s.y + s.d / 2;
    const nw = s.d, nd = s.w;
    let x = Math.round((cx - nw / 2) / 5) * 5, y = Math.round((cy - nd / 2) / 5) * 5;
    x = Math.max(0, Math.min(W - nw, x)); y = Math.max(0, Math.min(L - nd, y));
    if (s.category && E.WALL_CATS.has(s.category)) { if (nw < nd) x = cx < W / 2 ? 0 : W - nw; else y = cy < L / 2 ? 0 : L - nd; }
    place(id, { x, y, w: nw, d: nd });
  };
  return {
    move: (id, pos) => place(id, pos),
    rotate,
    validate: (id, pos) => {
      const spot = layout.slots.find((s) => s.id === id);
      if (!spot) return null;
      const moved = { ...spot, ...pos };
      const errs = errorsFor(moved);
      return errs.length ? errs[0] : null;
    },
    key: (id, e) => {
      const step = e.shiftKey ? 25 : 5;
      const d = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
      const s = layout.slots.find((x) => x.id === id);
      if (!s) return;
      if (d) { e.preventDefault(); place(id, { x: s.x + d[0], y: s.y + d[1] }); } else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); rotate(id); }
    },
    canReset: layout.slots.some((s) => s.home),
    reset: () => save(layout.slots.map((s) => { if (!s.home) return s; const { home, ...rest } = s; return { ...rest, ...home }; }), 'Spots moved back to where the layout put them.'),
  };
}

/* catalogue: demo products plus live seller listings, with reviews folded into ratings */
function buildCatalog(s) {
  const stores = new Map(CAT.STORES.map((st) => [st.id, { ...st, is_demo: true }]));
  const list = CAT.PRODUCTS.map((p) => ({ ...p, key: `${p.seller_id}:${p.id}` }));
  const sellers = (s.otherSellers || []).slice();
  if (s.seller) sellers.push({ ...s.seller, mine: true });
  for (const se of sellers) {
    if (!se || !se.business_name) continue;
    const demoShop = se.is_demo ? CAT.DEMO_SELLER : {};
    stores.set(se.id, { id: se.id, business_name: se.business_name, suburb: se.suburb, size: se.size, badges: se.badges || [], website: se.website || demoShop.website || '', about: se.about || demoShop.about || '', is_demo: false, mine: Boolean(se.mine) });
    for (const p of se.products || []) list.push({ ...p, seller_id: se.id, key: `${se.id}:${p.id}`, is_demo: false, rating_avg: 0, rating_count: 0, featured: isFeatured(p) });
  }
  const reviews = {};
  const add = (who, items) => { for (const [k, r] of Object.entries(items || {})) (reviews[k] = reviews[k] || []).push({ ...r, who }); };
  for (const [who, doc] of Object.entries(s.reviewDocs || {})) if (s.mode === 'cloud' || who !== Data.myReviewer()) add(who, doc && doc.items);
  if (s.mode !== 'cloud') add('me', s.myReviews);
  for (const p of list) {
    const rs = reviews[p.key] || [];
    const sum = p.rating_avg * p.rating_count + rs.reduce((a, r) => a + r.rating, 0);
    const n = p.rating_count + rs.length;
    p.rating = n ? sum / n : 0;
    p.ratings = n;
    p.reviews = rs;
    p.store = stores.get(p.seller_id) || { business_name: 'Unknown store', size: 'small', badges: [] };
  }
  return { list, stores, map: new Map(list.map((p) => [p.key, p])) };
}

function priceOf(p, optionId) {
  const o = (p.options || []).find((x) => x.id === optionId);
  return p.base_price_cents + (o ? o.price_delta_cents : 0);

function shortlistTotal(room, catalog, exceptSlot) {
  let total = 0;
  for (const it of room.shortlist || []) {
    if (exceptSlot && it.slot_id === exceptSlot) continue;
    const p = catalog.map.get(it.product_key);
    if (p) total += priceOf(p, it.option_id);
  }
  return total;
}

function slotProducts(room, layout, catalog) {
  const out = [];
  if (!layout) return out;
  for (const it of room.shortlist || []) {
    const slot = layout.slots.find((x) => x.id === it.slot_id);
    const p = catalog.map.get(it.product_key);
    if (!slot || !p) continue;
    const rect = E.placeProductInSlot(p, slot);
    if (!rect) continue;
    const back = slot.wall || (slot.facing ? OPPOSITE[slot.facing] : rect.rotation === 90 ? 'W' : 'N');
    out.push({ slot_id: slot.id, rect, back, category: p.category, title: p.title, colour: p.colour, height: p.height_cm });
  }
  return out;
}

function searchSlot(catalog, slot, category, filters, remaining) {
  let list = catalog.list.filter((p) => p.category === category && E.fitInSlot(p, slot));
  if (filters.renter) list = list.filter((p) => p.renter_friendly);
  if (filters.withinBudget) list = list.filter((p) => p.base_price_cents <= remaining);
  if (filters.styles.length) list = list.filter((p) => p.style_tags.some((t) => filters.styles.includes(t)));
  if (filters.cultural.length) list = list.filter((p) => (p.cultural_tags || []).some((t) => filters.cultural.includes(t)));
  if (filters.colours.length) list = list.filter((p) => filters.colours.includes(p.colour));
  if (filters.materials.length) list = list.filter((p) => filters.materials.includes(p.material));
  const max = toInt(filters.priceMax);
  if (isWhole(max) && max > 0) list = list.filter((p) => p.base_price_cents <= max * 100);
  if (filters.store !== 'all') list = list.filter((p) => p.store.size === filters.store);
  if (filters.badges.length) list = list.filter((p) => (p.store.badges || []).some((b) => filters.badges.includes(b)));
  const byPrice = (a, b) => a.base_price_cents - b.base_price_cents || b.rating - a.rating || a.title.localeCompare(b.title);
  const sponsored = list.filter((p) => p.featured).sort(byPrice)[0];
  const rest = list.filter((p) => p !== sponsored).sort(byPrice);
  // Equal footing: when a small business has a piece that fits, one is always in the top three.
  const top = sponsored ? 2 : 3;
  if (rest.length > top && !rest.slice(0, top).some((p) => p.store.size === 'small')) {
    const i = rest.findIndex((p) => p.store.size === 'small');
    if (i > 0) { const [p] = rest.splice(i, 1); rest.splice(top - 1, 0, { ...p, boosted: true }); }
  }
  return sponsored ? [{ ...sponsored, sponsoredSlot: true }, ...rest] : rest;
}

function Dialog({ title, onClose, children, footer, wide, sub }) {
  const ref = useRef(null);
  useEffect(() => {
    const prev = document.activeElement;
    const el = ref.current && ref.current.querySelector('input, select, textarea, button:not(.close)');
    if (el) el.focus();
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => { document.removeEventListener('keydown', onKey); if (prev && prev.focus) prev.focus(); };
  }, []);
  return html`<div class="overlay" onClick=${(e) => { if (e.target === e.currentTarget) onClose(); }}>
    <div class=${`dialog ${wide ? 'wide' : ''}`} role="dialog" aria-modal="true" aria-label=${title} ref=${ref}>
      <header><div class="stack" style="gap:3px"><h3>${title}</h3>${sub && html`<p class="small soft">${sub}</p>`}</div>
        <button class="btn ghost small close" onClick=${onClose} aria-label="Close">Close</button></header>
      <div class="content">${children}</div>
      ${footer && html`<footer>${footer}</footer>`}
    </div>
  </div>`;
}

// Big or unusual images are redrawn as a JPEG no wider than 1600 px before they go to Claude.
function prepImage(blob, types) {
  const ok = (types || ['image/jpeg', 'image/png', 'image/webp', 'image/gif']).includes(blob.type);
  if (ok && blob.size <= 3.5 * 1024 * 1024) return Promise.resolve(blob);
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.naturalWidth * k));
      c.height = Math.max(1, Math.round(img.naturalHeight * k));
      const g = c.getContext('2d');
      g.fillStyle = '#ffffff';
      g.fillRect(0, 0, c.width, c.height);
      g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob((b) => (b ? resolve(b) : reject(new Error('encode'))), 'image/jpeg', 0.86);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode')); };
    img.src = url;
  });
}

// Long notes end at a full stop rather than mid-word.
function trimNote(t, max) {
  const s = String(t).replace(/\s+/g, ' ').trim();
  if (s.length <= max) return s;
  const cut = s.slice(0, max);
  const end = cut.lastIndexOf('. ');
  return end > max / 3 ? cut.slice(0, end + 1) : `${cut.replace(/\s+\S*$/, '')}…`;
}

// Turns whatever came back into a room the engine accepts, or explains why it can't.
function cleanScan(g) {
  if (!g || typeof g !== 'object' || Array.isArray(g)) return { error: "Claude couldn't read a room from that image. Try a clearer photo or a floor plan." };
  if (g.error) return { error: "That doesn't look like a room or a floor plan. Try another image." };
  const r5 = (v) => Math.round(Number(v) / 5) * 5;
  const W = r5(g.width_cm), L = r5(g.length_cm);
  if (!(W >= 200 && W <= 1000 && L >= 200 && L <= 1000)) {
    return { error: "Claude couldn't work out the room's size from that image. Try a floor plan with printed measurements, or type the sizes in." };
  }
  const wallLen = (w) => (w === 'N' || w === 'S' ? W : L);
  const wallOf = (w) => { const t = String(w || '').trim().toUpperCase().charAt(0); return ['N', 'E', 'S', 'W'].includes(t) ? t : null; };
  const dg = g.door && typeof g.door === 'object' ? g.door : {};
  const dWall = wallOf(dg.wall) || 'S';
  const dWidth = Math.min(120, Math.max(60, Math.round(Number(dg.width_cm) || 82)));
  let dOff = Math.round(Number(dg.offset_cm));
  if (!Number.isFinite(dOff)) dOff = Math.round((wallLen(dWall) - dWidth) / 2);
  const door = { wall: dWall, offset_cm: Math.max(0, Math.min(wallLen(dWall) - dWidth, dOff)), width_cm: dWidth };
  const windows = [];
  for (const w of (Array.isArray(g.windows) ? g.windows : []).slice(0, 4)) {
    if (windows.length >= 2 || !w || typeof w !== 'object') continue;
    const wall = wallOf(w.wall);
    let width = Math.round(Number(w.width_cm));
    if (!wall || !(width >= 30)) continue;
    width = Math.min(width, wallLen(wall));
    let off = Math.round(Number(w.offset_cm));
    if (!Number.isFinite(off)) off = Math.round((wallLen(wall) - width) / 2);
    off = Math.max(0, Math.min(wallLen(wall) - width, off));
    if (wall === door.wall && off < door.offset_cm + door.width_cm && door.offset_cm < off + width) continue;
    windows.push({ wall, offset_cm: off, width_cm: width });
  }
  const room = { type: /living|lounge/i.test(String(g.room_type || '')) ? 'living' : 'bedroom', width_cm: W, length_cm: L, door, windows };
  if (E.checkRoom(room).length) room.windows = [];
  if (E.checkRoom(room).length) return { error: "The door and windows Claude found don't fit together. Type the sizes in instead." };
  const items = [];
  for (const f of (Array.isArray(g.furniture) ? g.furniture : []).slice(0, 12)) {
    if (!f || typeof f !== 'object' || items.length >= 10) continue;
    const category = normCategory(f.category) || normCategory(f.name);
    const w = Math.round(Number(f.width_cm)), d = Math.round(Number(f.depth_cm));
    if (!category || !(w >= 10 && w <= 500 && d >= 10 && d <= 500)) continue;
    const name = (typeof f.name === 'string' && f.name.trim() ? f.name.trim() : E.label(category)).slice(0, 40);
    items.push({ name: name.charAt(0).toUpperCase() + name.slice(1), category, width_cm: w, depth_cm: d });
  }
  return {
    room, items,
    source: g.source === 'plan' ? 'plan' : 'photo',
    confidence: ['high', 'medium', 'low'].includes(g.confidence) ? g.confidence : 'medium',
    notes: typeof g.notes === 'string' ? trimNote(g.notes, 300) : '',
  };
}

const wallName = (w) => ({ N: 'top wall', E: 'right wall', S: 'bottom wall', W: 'left wall' }[w] || 'wall');
